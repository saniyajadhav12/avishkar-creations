AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Avishkar Creations image processor. Creates product image variants at upload time.

Parameters:
  SupabaseUrl:
    Type: String
    Description: Supabase project URL (public)
  SupabasePublishableKey:
    Type: String
    Description: Supabase publishable key (public by design; access is enforced by RLS)
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: "https://avishkar-creations.pages.dev,http://localhost:3000"
    Description: Sites allowed to call the Function URL from a browser

Resources:
  ImageProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: avishkar-image-processor
      CodeUri: .
      Handler: src/index.handler
      Runtime: nodejs22.x
      # x86_64 matches GitHub's build machines, so sharp's native binaries fit the Lambda
      Architectures:
        - x86_64
      MemorySize: 1024
      Timeout: 30
      Environment:
        Variables:
          SUPABASE_URL: !Ref SupabaseUrl
          SUPABASE_PUBLISHABLE_KEY: !Ref SupabasePublishableKey
      FunctionUrlConfig:
        # The function checks the admin's Supabase token itself, like the Cloudflare Worker
        AuthType: NONE
        Cors:
          AllowOrigins: !Ref AllowedOrigins
          AllowMethods:
            - POST
          AllowHeaders:
            - authorization
            - content-type
          MaxAge: 86400

  ImageProcessorLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/avishkar-image-processor
      RetentionInDays: 14

Outputs:
  FunctionUrl:
    Description: Function URL to set as NEXT_PUBLIC_IMAGE_PROCESSOR_URL
    Value: !GetAtt ImageProcessorFunctionUrl.FunctionUrl
